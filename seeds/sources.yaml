# Стартовый реестр источников (ТЗ, раздел 7). Утверждает владелец проекта.
#
# ЧЕРНОВИК для разработки (12.10.2026): RSS-ленты проверены — отвечают из локальной сети.
# Перекос в сторону крупных федеральных СМИ — это технический набор, а не итоговый реестр.
# Владельцу проекта нужно: добавить региональные, отраслевые и независимые источники,
# проверить owner (группа владения: сайт и TG-канал одной редакции, издания одного холдинга —
# одно подтверждение, 6.3) и решить по зарубежным русскоязычным изданиям и ресурсам
# со статусом иноагента/блокировки.
#
# type: media | tg | vk | official | agency
# rss — для media/official/agency; для tg — handle_or_domain вида @канал.
# aliases — как источник называют в чужих текстах («по данным ТАСС», «сообщают „Известия“»),
#   включая падежные формы. Используются для рёбер attribution в графе заимствований.

