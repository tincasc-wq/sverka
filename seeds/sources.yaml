# Стартовый реестр источников (ТЗ, раздел 7). Утверждает владелец проекта.
#
# ЧЕРНОВИК для разработки (12.10.2026): RSS-ленты проверены — отвечают из локальной сети.
# Перекос в сторону крупных федеральных СМИ — это технический набор, а не итоговый реестр.
# Владельцу проекта нужно: добавить региональные, отраслевые и независимые источники,
# проверить owner (группа владения: сайт и TG-канал одной редакции, издания одного холдинга —
# одно подтверждение, 6.3) и решить по зарубежным русскоязычным изданиям и ресурсам
# со статусом иноагента/блокировки.
#
# type: media | tg | vk | official | agency
# rss — для media/official/agency; для tg — handle_or_domain вида @канал.
# aliases — как источник называют в чужих текстах («по данным ТАСС», «сообщают „Известия“»),
#   включая падежные формы. Используются для рёбер attribution в графе заимствований.

sources:
  # Информагентства
  - {name: ТАСС, type: agency, handle_or_domain: tass.ru, owner: ТАСС,
     rss: "https://tass.ru/rss/v2.xml", aliases: [ТАСС]}
  - {name: РИА Новости, type: agency, handle_or_domain: ria.ru, owner: МИА «Россия сегодня»,
     rss: "https://ria.ru/export/rss2/archive/index.xml", aliases: [РИА Новости, РИА]}
  - {name: Интерфакс, type: agency, handle_or_domain: interfax.ru, owner: Интерфакс,
     rss: "https://www.interfax.ru/rss.asp", aliases: [Интерфакс, Интерфакса, Интерфаксу]}
  - {name: Regnum, type: agency, handle_or_domain: regnum.ru, owner: Regnum,
     rss: "https://regnum.ru/rss", aliases: [Regnum, Регнум, ИА Регнум]}

  # Официальные
  - {name: Президент России, type: official, handle_or_domain: kremlin.ru, owner: Администрация Президента,
     rss: "http://kremlin.ru/events/all/feed", aliases: [Кремль, Кремля, пресс-служба Кремля, сайт Кремля]}
  - {name: Правительство России, type: official, handle_or_domain: government.ru, owner: Правительство РФ,
     rss: "http://government.ru/all/rss/", aliases: [правительства РФ, правительство РФ, кабмина]}

  # СМИ
  - {name: РБК, type: media, handle_or_domain: rbc.ru, owner: РБК,
     rss: "https://rssexport.rbc.ru/rbcnews/news/30/full.rss", aliases: [РБК]}
  - {name: Коммерсантъ, type: media, handle_or_domain: kommersant.ru, owner: Коммерсантъ,
     rss: "https://www.kommersant.ru/RSS/news.xml",
     aliases: [Коммерсантъ, Коммерсант, Коммерсанта, Коммерсанту, Ъ]}
  - {name: Ведомости, type: media, handle_or_domain: vedomosti.ru, owner: Ведомости,
     rss: "https://www.vedomosti.ru/rss/news", aliases: [Ведомости, Ведомостей, Ведомостям]}
  - {name: Forbes Россия, type: media, handle_or_domain: forbes.ru, owner: Forbes Россия,
     rss: "https://www.forbes.ru/newrss.xml", aliases: [Forbes]}
  - {name: Лента.ру, type: media, handle_or_domain: lenta.ru, owner: Лента.ру,
     rss: "https://lenta.ru/rss/news", aliases: [Лента.ру, Ленты.ру, Lenta.ru]}
  - {name: Известия, type: media, handle_or_domain: iz.ru, owner: Известия,
     rss: "https://iz.ru/xml/rss/all.xml", aliases: [Известия, Известий, Известиям]}
  - {name: Российская газета, type: media, handle_or_domain: rg.ru, owner: Российская газета,
