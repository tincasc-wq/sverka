# Маршрутизация LLM по шагам конвейера (ТЗ, раздел 8.1).
# Порядок в списке = порядок перехода на резерв. Решение владельца от 12.10.2026:
# по умолчанию DeepSeek; госконтур — только российские модели; Claude — выключен.

providers:
  deepseek:
    enabled: true
    base_url: https://api.deepseek.com
    # Проверено 12.10.2026: из РФ доступен напрямую (0.4 с); шлюз — только запасной путь.
    via_gateway: false
  qwen:
    enabled: true
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    via_gateway: true
  yandex:
    enabled: true
    base_url: https://llm.api.cloud.yandex.net/v1   # OpenAI-совместимый API Yandex AI Studio
    via_gateway: false           # из РФ напрямую
  gigachat:
    # Пока только для сравнения моделей (python -m app.quality.models), в маршрутах не участвует.
    enabled: true
    base_url: https://gigachat.devices.sberbank.ru/api/v1
    auth: gigachat
    auth_url: https://ngw.devices.sberbank.ru:9443/api/v2/oauth
    json_mode: false             # response_format не поддерживает: JSON просим в промпте
    via_gateway: false
  kilo:
    # Kilo Gateway: бесплатные модели (Nemotron и др.) — ТОЛЬКО для сравнения моделей
    # (python -m app.quality.models). Промпты бесплатных моделей логируются провайдерами
    # («только пробное использование» у NVIDIA) — в маршруты проверок не включать.
    # Из РФ напрямую не открывается; без ключа — 200 запросов в час с IP.
    enabled: true
    base_url: https://ai-gateway.kilo.ai/api/v1
    auth: none
    via_gateway: true
  anthropic:
    # Запасной вариант на случай законного доступа (изменение условий Anthropic или договор
    # через юрлицо в поддерживаемой стране). Обход региональных ограничений через шлюз
    # нарушает условия Anthropic — не включать без такого основания.
    enabled: false
    via_gateway: false

# thinking: deepseek-flash по умолчанию «рассуждает» — на извлечении 2300 токенов рассуждений,
# 11 с и ≈0.28 ₽ за вызов против 1.3 с и ≈0.03 ₽ с thinking: disabled (замер 12.10.2026).
# Простые шаги — без рассуждений. Спорная сверка — другой, более сильной моделью, тоже без
# рассуждений: с ними v4-pro писал до 7 тыс. токенов и думал 49 с (хуситы, 12.10.2026) —
# 95% цены проверки и минута ожидания в боте.
routes:
  extract_claims:
    - {provider: deepseek, model: deepseek-flash, thinking: disabled}
    - {provider: qwen, model: qwen-flash}
    - {provider: yandex, model: alice-ai-llm-flash}
  same_event:
    - {provider: deepseek, model: deepseek-flash, thinking: disabled}
    - {provider: qwen, model: qwen-flash}
    - {provider: yandex, model: alice-ai-llm-flash}
  verify:
    - {provider: deepseek, model: deepseek-flash, thinking: disabled}
    - {provider: qwen, model: qwen-flash}
    - {provider: yandex, model: deepseek-v4-flash}
  verify_disputed:
    - {provider: deepseek, model: deepseek-v4-pro, thinking: disabled}
    - {provider: qwen, model: qwen-max}
    - {provider: yandex, model: alice-ai-llm}

# Госконтур (организации с флагом ru_only): только эти маршруты, мимо шлюза.
ru_only_routes:
  extract_claims: [{provider: yandex, model: alice-ai-llm-flash}]
  same_event: [{provider: yandex, model: alice-ai-llm-flash}]
  verify: [{provider: yandex, model: deepseek-v4-flash}]
  verify_disputed: [{provider: yandex, model: alice-ai-llm}]

# Дневной потолок расходов по провайдеру, USD. При превышении — оповещение и переход дальше.
daily_budget_usd:
  deepseek: 5
  qwen: 5
  yandex: 5
  anthropic: 0

# Названия моделей уточнить по документации провайдеров при подключении (этап 3, LLM).

# Цены, USD за 1 млн токенов (пиковый тариф). Для учёта расходов в llm_calls.
# Источник: api-docs.deepseek.com/quick_start/pricing (14.10.2026); остальные — уточнить.
# DeepSeek: вход из кэша почти бесплатен, вне пиковых часов всё вдвое дешевле. Праздники Китая
# (тоже «вне пика») не учитываем — в эти дни расход чуть завышен, то есть оценка сверху.
peak_hours_utc: [[1, 4], [6, 10]]
prices:
  deepseek-flash: {input: 0.30, output: 1.20, cached_input: 0.006, offpeak_factor: 0.5}
  deepseek-v4-pro: {input: 1.32, output: 3.96, cached_input: 0.044, offpeak_factor: 0.5}
  qwen-flash: {input: 0.10, output: 0.40}
  qwen-max: {input: 1.60, output: 6.40}
