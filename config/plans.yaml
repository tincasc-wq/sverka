# Тарифы (ТЗ, раздел 12.2). Лимит проверок — общий для бота и сайта: пользователь бота
# опознаётся по Telegram ID, даже если ни разу не заходил на сайт.
#
# Порядок выбора тарифа: организация (кабинет, месячная квота) → платный тариф с действующим
# сроком (назначает админ) → standard (вход по почте или Telegram, в том числе просто бот)
# → guest (сайт без входа).
#
# price — как показывать цену на странице «Тарифы»; soon — функции, которых ещё нет.
# Себестоимость LLM (замер 13.10.2026): ~0.5 ₽ за проверку, до 3 ₽ у больших историй;
# повторная проверка той же новости в течение 6 ч — из кэша, 0 ₽.

plans:
  guest:
    name: Гость
    daily_checks: 5
    price: бесплатно
    public: false
    features:
      - Полный отчёт по ссылке или тексту
  standard:
    name: Стандарт
    daily_checks: 10
    price: бесплатно
    features:
      - 10 проверок в сутки — в боте и на сайте вместе
      - Полный отчёт, индекс подтверждённости
      - История проверок на любом устройстве
  pro:
    name: Pro
    monthly_checks: 1000          # месячный лимит: в горячий день можно больше, расходы ограничены
    price: 1 990 ₽/мес            # с 14.10.2026; бытовому пользователю хватает «Стандарта» (10 в сутки)
    paid: true
    pdf: true
    priority: true
    schedule: true
    ocr: true
    features:
      - 1 000 проверок в месяц — в среднем 33 в день
      - Всё из «Стандарта»
      - Отчёт в PDF — для письма, архива, планёрки
      - Приоритет в очереди проверок
      - Слежение за новостью — повторная проверка по расписанию с сообщением об изменениях
      - Проверка скриншотов — распознаём текст с картинки и проверяем его
  team:
    name: Команда
    org: true
    seats: 3
    monthly_checks: 3500
    price: 5 900 ₽/мес
    pdf: true
    priority: true
    schedule: true
    ocr: true
    features:
      - До 3 мест, общий объём 3 500 проверок в месяц
      - Кабинет команды, общая история
      - Закрытые отчёты — видны только команде
      - Отчёты в PDF, приоритет в очереди, слежение за новостями, проверка скриншотов
  editorial:
    name: Редакция
    org: true
    price: от 15 000 ₽/мес
    pdf: true
    priority: true
    schedule: true
    ocr: true
    features:
      - 5 мест и 6 000 проверок в базе; до 15 мест и 20 000 проверок
      - Кабинет организации, общая история, закрытые отчёты, PDF, приоритет, слежение
      - Конструктор — цена зависит от состава тарифа
    # Конструктор: цена = база + доп. места + доп. объём + опции. ЧЕРНОВЫЕ ставки — уточнить.
    # Себестоимость LLM (DeepSeek): ~0.5 ₽ за проверку; российские модели — ~7–22 ₽ (ТЗ 12.5),
    # поэтому российский контур берётся за каждую проверку объёма, а не фиксированной суммой.
    constructor:
      base_price: 15000
      base_seats: 5
      base_checks: 6000
      max_seats: 15
      seat_price: 1500
      checks_step: 1000
      checks_step_price: 1500
      max_checks: 20000
      options:
        - code: ru_only
          name: Российский контур
          # Доплата по запросу: ставку назначим после замера стоимости российских моделей
          # (DeepSeek оказался дешевле прогноза — российские модели тоже надо мерить, не гадать).
          per_check: null
          description: Проверки обрабатываются только российскими языковыми моделями — для госзаказчиков и аппаратов
  monitoring:
    name: Мониторинг
    org: true
    price: пилот по запросу
    pdf: true
    priority: true
    schedule: true
    ocr: true
    features:
      - Всё из «Редакции»
      - Пилот под задачи клиента
    soon:
      - Отслеживание тем и брендов
      - Оповещение о новой истории в течение часа
      - Еженедельный отчёт
