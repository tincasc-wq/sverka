# Веса и пороги индекса подтверждённости и рейтинга источников (ТЗ, разделы 6.5–6.6).
# Стартовые значения; калибруются на эталонных историях.

confirmation_index:
  type_weights:
    official: 2.0
    agency: 1.5
    media: 1.0
    tg: 0.5
    vk: 0.5
    satire: 0.0       # сатира не подтверждает и не опровергает
    aggregator: 0.0   # агрегатор пересказывает других — не самостоятельное подтверждение
  stance_sign:
    supports: 1.0
    contradicts: -1.0
    refines: 0.5
    unrelated: 0.0
  main_claim_weight: 2.0
  too_early_hours: 6
  statuses:            # нижняя граница включительно
    widely_confirmed: 75
    partially_confirmed: 50
    not_confirmed: 25  # ниже — «есть опровержения»

clustering:
  window_hours: 72
  # Калибровка на архиве 12.10.2026 (bge-m3): перепечатки одного события 0.88–0.95,
  # та же тема / другое событие 0.82–0.86, короткие тексты того же события ~0.83.
  strong_threshold: 0.88      # одно событие в любой точке окна
  include_threshold: 0.80     # одно событие, если не дальше near_hours от исходной публикации
  near_hours: 12
  llm_review_from: 0.75       # ниже порога, но выше этого — «пограничные», решит LLM
  candidates_top_k: 50
  title_trgm_threshold: 0.5   # похожие заголовки без эмбеддинга тоже в кандидаты
  # Пары на разных языках (англ. ↔ рус.): bge-m3 даёт им близость ниже. Калибровка 13.10.2026
  # (python -m app.quality.crosslingual, 881 пара, разметка LLM): то же событие — медиана
  # 0.79 (TASS English) / 0.73 (другие издания), при пороге 0.80 в историю попадало 41% / 7%.
  # Поправка прибавляется к близости: ядро с 0.80 (точность 0.96–1.0), включение с 0.72
  # (0.84–0.89), на проверку LLM с 0.67.
  crosslingual_offset: 0.08

graph:
  near_copy_max_hamming: 3
  near_copy_min_words: 20      # короче — simhash не различает тексты
  confidence:
    explicit_link: 0.95
    attribution: 0.8
    official_document: 0.6     # «следует из указа» при официальной публикации раньше в истории
    near_copy: 0.7
  unreliable_date_hours: 2
  clock_tolerance_minutes: 10  # заявленная дата может опережать наш first_seen_at на интервал опроса
  attribution_window_chars: 60 # сколько символов вокруг «по данным / сообщает» искать имя источника

source_rating:
  half_life_days: 180
  silent_edit_penalty: 0.5
  min_outcomes_to_show: 10
  min_score_change: 0.5      # меньше — новую запись в историю рейтинга не пишем
  priors:              # alpha0 / beta0 по типу источника
    agency: [6, 2]
    official: [6, 2]
    media: [3, 2]
    tg: [2, 2]
    vk: [2, 2]
    satire: [1, 9]     # вымысел по замыслу — рейтинг не показывается в выдаче
    aggregator: [2, 2] # отвечает за то, что пересказывает: подхватил фейк — минус
