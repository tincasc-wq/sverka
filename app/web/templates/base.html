<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Сверка — админка{% endblock %}</title>
<style>
  :root { --ink:#1d2433; --muted:#6b7385; --line:#dde2ea; --bg:#f6f7f9; --accent:#2f6fde;
          --good:#2e8b57; --bad:#c0392b; --warn:#b7791f; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:10px 20px; display:flex; gap:20px; align-items:center; }
  header b { font-size:17px; }
  header a { color:var(--muted); text-decoration:none; }
  header a.on { color:var(--ink); font-weight:600; }
  main { max-width:1180px; margin:20px auto; padding:0 16px; }
  h1 { font-size:22px; margin:0 0 12px; }
  h2 { font-size:17px; margin:24px 0 8px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:13px; color:var(--muted); font-weight:600; background:#fafbfc; }
  a { color:var(--accent); }
  .muted { color:var(--muted); font-size:13px; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; background:#eef1f6; color:var(--muted); }
  .tag.probable { background:#fdf3e1; color:var(--warn); }
  .tag.bad { background:#fbeaea; color:var(--bad); }
  .tag.good { background:#e8f5ee; color:var(--good); }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  .row { display:flex; gap:24px; flex-wrap:wrap; }
  .big { font-size:28px; font-weight:700; }
  button, .btn { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.confirmed { border-color:var(--good); color:var(--good); }
  button.refuted { border-color:var(--bad); color:var(--bad); }
  input[type=text], input[type=url], input[type=password], textarea { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; width:100%; }
  .stances label { margin-right:10px; font-size:13px; white-space:nowrap; }
  @media (max-width: 700px) { th:nth-child(n+4), td:nth-child(n+4) { display:none; } }
</style>
</head>
<body>
<header>
  <b>Сверка</b>
  <a href="/admin/stories" class="{{ 'on' if nav == 'stories' }}">Истории</a>
  <a href="/admin/sources" class="{{ 'on' if nav == 'sources' }}">Источники</a>
  <a href="/admin/feedback" class="{{ 'on' if nav == 'feedback' }}">Жалобы</a>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
