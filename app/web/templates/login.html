{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:380px">
  <h1>Вход</h1>
  <form method="post" action="/admin/login">
    <p><input type="password" name="token" placeholder="ADMIN_TOKEN из .env" autofocus></p>
    {% if error %}<p class="tag bad">{{ error }}</p>{% endif %}
    <button type="submit">Войти</button>
  </form>
  <p class="muted" style="margin-top:12px">Обычный путь — <a href="/login">войти на сайт</a> по почте или через Telegram
  под учётной записью администратора: тогда токен не нужен.</p>
</div>
{% endblock %}
